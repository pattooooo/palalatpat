<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Commission Queue - พะละลัดพัด</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back" />
  <link rel="icon" type="image/x-icon" href="/img/palalatpat.png">
  <style>
    :root {
      --ink: #1e2440;
      --fb: #1877f2;
      --fb-dark: #0f5fce;
      --amber: #f5a24a;
      --amber-dark: #ee9333;
      --peach-1: #ffb37a;
      --peach-2: #ff9d5c;
      --coral: #ff7e6b;
      --gold: #ffd166;
      --bg-white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'IBM Plex Sans Thai', sans-serif;
      background: var(--bg-white);
      color: var(--ink);
      overflow-x: hidden;
    }

    /* Ambient animated background, shared with the main site */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: var(--bg-white);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.9;
      mix-blend-mode: multiply;
      will-change: transform;
    }

    .blob-1 {
      width: 66vw;
      height: 66vw;
      max-width: 780px;
      max-height: 780px;
      right: -20vw;
      top: -20vw;
      background: radial-gradient(circle at 30% 30%, var(--peach-1), var(--coral) 65%, transparent 100%);
      animation: drift1 20s ease-in-out infinite;
    }

    .blob-2 {
      width: 60vw;
      height: 60vw;
      max-width: 680px;
      max-height: 680px;
      left: -18vw;
      bottom: -22vw;
      background: radial-gradient(circle at 60% 40%, var(--gold), var(--peach-2) 65%, transparent 100%);
      animation: drift2 24s ease-in-out infinite;
    }

    .blob-3 {
      width: 32vw;
      height: 32vw;
      max-width: 380px;
      max-height: 380px;
      left: 8vw;
      top: 12vh;
      background: radial-gradient(circle at 50% 50%, var(--coral), transparent 72%);
      animation: drift3 18s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-5%, 5%) scale(1.1); }
    }

    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, -5%) scale(1.08); }
    }

    @keyframes drift3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(3%, 4%) scale(1.15); opacity: 0.75; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob-1, .blob-2, .blob-3 { animation: none; }
    }

    .container-xl {
      max-width: 1100px;
      padding: 3rem 1.5rem 4rem;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      border: none;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 10px 24px -10px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      text-decoration: none;
      flex-shrink: 0;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -10px rgba(0,0,0,0.26);
    }

    h1 {
      font-weight: 700;
      font-size: clamp(1.4rem, 3.2vw, 2rem);
      color: var(--ink);
      margin: 0;
      line-height: 1.3;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 1.5rem;
      padding: 1.75rem;
      box-shadow: 0 20px 50px -20px rgba(30, 36, 64, 0.2);
    }

    input[type="text"] {
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 16px;
      font-family: 'IBM Plex Sans Thai', sans-serif;
      border-radius: 999px;
      border: 1px solid #eee;
      width: 100%;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: box-shadow 0.18s ease, border-color 0.18s ease;
    }

    input[type="text"]:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(245, 162, 74, 0.25);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0.2em;
      font-size: 0.95rem;
    }

    th, td {
      border-radius: 0.6em;
      padding: 10px 8px;
      word-wrap: break-word;
    }

    th {
      background-color: #faf5ef;
      color: var(--ink);
      text-align: center;
      font-weight: 600;
    }

    td {
      border: 1px solid #eee;
      background: #fff;
    }

    /* Status badge styles */
    .status {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85em;
      font-weight: 600;
      display: inline-block;
      white-space: nowrap;
    }

    .รอการชำระเงิน        { background-color: #f4c7c3; color: #5a1e0c; }
    .รอดำเนินการ         { background-color: #e4e4e4; color: #333; }
    .รอการยืนยัน         { background-color: #5c2d0f; color: white; }
    .เสร็จสิ้น             { background-color: #b7e1cd; color: #1d5c2f; }
    .ยกเลิก               { background-color: #990000; color: white; }
    .ระหว่างร่างภาพ       { background-color: #a3c6f1; color: #0b3d91; }
    .ระหว่างทำงาน         { background-color: var(--fb); color: white; }
    .อยู่ระหว่างแก้ไข     { background-color: var(--gold); color: #333; }
    .ล่าช้า               { background-color: #990000; color: #f8d7da; animation: blink-bg 1s ease-in-out 5;}
    .N_A                  { background-color: #444; color: white; }
    @keyframes blink-bg {
      0%   { background-color: #990000; }
      50%  { background-color: #ff6b6b; }
      100% { background-color: #990000; }
    }

    .spin {
      width: 50px;
      height: 50px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #loadingMessage h2 {
      font-weight: 600;
      color: var(--ink);
      font-size: 1.2rem;
    }

    @media (max-width: 640px) {
      .card { padding: 1.1rem; border-radius: 1.1rem; }
      table { font-size: 0.82rem; }
      th, td { padding: 6px 5px; }
    }
  </style>
</head>

<body>
  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container-xl">
    <div class="top-row">
      <a class="back-btn" href="index.html" title="ย้อนกลับ">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <h1>ตารางตรวจสอบสถานะคอมมิชชั่นพะละลัดพัด</h1>
    </div>

    <div class="card">
      <input type="text" id="searchInput" placeholder="ค้นหา...">
      <div id="loadingMessage" style="text-align: center;"><img src="img/palalatpat.png" alt="patspin" class="spin" style="margin: 1em;"><h2>Loading...</h2></div>
      <table id="sheetTable" style="display: none;"></table>
    </div>
  </div>

  <script>
    const HIDDEN_COLUMNS = [6];
    const STATUS_COLUMN_INDEX = 3;

    fetch("https://script.google.com/macros/s/AKfycbzGqyVqni0CVlk0fSv4OPfbAwJKrY2GWLUMMhMyvrA1QnjVHo-3u_3-SmxZlYS_YxghMg/exec")
    .then(res => res.json())
    .then(data => {
      document.getElementById("loadingMessage").style.display = "none"; // hide loading
      document.getElementById("sheetTable").style.display = "table";     // show table
      buildTable(data);
    });

    function buildTable(data) {
      const table = document.getElementById("sheetTable");
      table.innerHTML = "";

      // Header row
      const headerRow = document.createElement("tr");
      data[0].forEach((header, i) => {
        if (!HIDDEN_COLUMNS.includes(i)) {
          const th = document.createElement("th");
          th.textContent = header;
          headerRow.appendChild(th);
        }
      });
      table.appendChild(headerRow);

      // Data rows
      for (let i = 1; i < data.length; i++) {
        const row = document.createElement("tr");
        data[i].forEach((cell, j) => {
          if (!HIDDEN_COLUMNS.includes(j)) {
            const td = document.createElement("td");

            // If this is the status column, apply badge style
            if (j === STATUS_COLUMN_INDEX) {
              const span = document.createElement("span");
              const cleaned = (cell || "N/A").replace(/\s/g, "");
              span.className = `status ${cleaned}`;
              span.textContent = cell || "N/A";
              td.appendChild(span);
            } else {
              td.textContent = cell;
            }

            row.appendChild(td);
          }
        });
        table.appendChild(row);
      }
    }

    // Search filter
    document.getElementById("searchInput").addEventListener("input", function () {
      const filter = this.value.toLowerCase();
      const table = document.getElementById("sheetTable");
      const rows = table.getElementsByTagName("tr");

      for (let i = 1; i < rows.length; i++) {
        const cells = rows[i].getElementsByTagName("td");
        let match = false;
        for (let j = 0; j < cells.length; j++) {
          if (cells[j].textContent.toLowerCase().includes(filter)) {
            match = true;
            break;
          }
        }
        rows[i].style.display = match ? "" : "none";
      }
    });
  </script>
</body>
</html>
