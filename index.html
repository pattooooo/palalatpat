<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>พะละลัดพัด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/img/palalatpat.png">
<style>
  :root {
    --ink: #1e2440;
    --fb: #1877f2;
    --fb-dark: #0f5fce;
    --amber: #f5a24a;
    --amber-dark: #ee9333;
    --peach-1: #ffb37a;
    --peach-2: #ff9d5c;
    --coral: #ff7e6b;
    --gold: #ffd166;
    --bg-white: #ffffff;
    --muted: #b9bccb;
    --muted-dark: #a3a6b8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background: var(--bg-white);
    overflow-x: hidden;
  }

  /* Ambient soft-gradient background, drifting slowly */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: var(--bg-white);
    mix-blend-mode: multiply;
    opacity: 0.1;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    mix-blend-mode: multiply;
    will-change: transform;
  }

  .blob-1 {
    width: 66vw;
    height: 66vw;
    max-width: 780px;
    max-height: 780px;
    right: -20vw;
    top: -20vw;
    background: radial-gradient(circle at 30% 30%, var(--peach-1), var(--coral) 65%, transparent 100%);
    animation: drift1 20s ease-in-out infinite;
  }

  .blob-2 {
    width: 60vw;
    height: 60vw;
    max-width: 680px;
    max-height: 680px;
    left: -18vw;
    bottom: -22vw;
    background: radial-gradient(circle at 60% 40%, var(--gold), var(--peach-2) 65%, transparent 100%);
    animation: drift2 24s ease-in-out infinite;
  }

  .blob-3 {
    width: 32vw;
    height: 32vw;
    max-width: 380px;
    max-height: 380px;
    left: 8vw;
    top: 12vh;
    background: radial-gradient(circle at 50% 50%, var(--coral), transparent 72%);
    animation: drift3 18s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-5%, 5%) scale(1.1); }
  }

  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(5%, -5%) scale(1.08); }
  }

  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
    50% { transform: translate(3%, 4%) scale(1.15); opacity: 0.75; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob-1, .blob-2, .blob-3 { animation: none; }
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    z-index: 1;
  }

  .layout {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4rem;
    flex-wrap: wrap;
  }

  .brand {
    flex: 1 1 320px;
    min-width: 260px;
  }

  .brand h1 {
    margin: 0;
    font-weight: 700;
    color: var(--ink);
    font-size: clamp(2.6rem, 6vw, 4.6rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
  }

  .brand .said {
    font-weight: 700;
    display: block;
  }

  .links {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    min-width: 240px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    justify-content: center;
    padding: 1rem 2rem;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.15rem;
    color: #fff;
    z-index: 1;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,0.18);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }

  .pill:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 30px -8px rgba(0,0,0,0.24);
    filter: brightness(1.03);
  }

  .pill:active {
    transform: translateY(-1px) scale(0.99);
  }

  .pill:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  .pill-fb {
    background: linear-gradient(135deg, var(--fb), var(--fb-dark));
    box-shadow: 0 10px 24px -8px rgba(15, 95, 206, 0.45);
  }

  .pill-queue {
    background: linear-gradient(135deg, var(--amber), var(--amber-dark));
    box-shadow: 0 10px 24px -8px rgba(238, 147, 51, 0.45);
  }

  .pill .icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 50%;
  }

  .pill-fb .icon svg { fill: var(--fb); width: 16px; height: 16px; }
  .pill-queue .icon svg { fill: var(--amber-dark); width: 16px; height: 16px; }

  /* Disabled "Comic" pill */
  .pill-disabled {
    background: linear-gradient(135deg, var(--muted), var(--muted-dark));
    color: #6b6f80;
    cursor: not-allowed;
    box-shadow: 0 6px 16px -8px rgba(0,0,0,0.12);
    pointer-events: none;
    opacity: 0.85;
  }

  .pill-disabled .icon {
    background: rgba(255,255,255,0.7);
  }

  .pill-disabled .icon svg { fill: var(--muted-dark); width: 16px; height: 16px; }

  @media (max-width: 640px) {
    .layout {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2.5rem;
    }
    .links { width: 100%; }
    .pill { width: 100%; }
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="page">
  <div class="layout">
    <div class="brand">
      <h1>พะละลัดพัด<span class="said">said</span></h1>
    </div>

    <div class="links">
      <a class="pill pill-fb" href="https://www.facebook.com/patpalatpatto/" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94z"/></svg>
        </span>
        Facebook
      </a>

      <a class="pill pill-queue" href="https://commission.nratpol.xyz/" target="_blank" rel="noopener noreferrer">
        <span class="icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/></svg>
        </span>
        ตารางคอมมิชชั่น
      </a>

      <span class="pill pill-disabled" aria-disabled="true" tabindex="-1">
        <span class="icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h18v8zM7 10h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"/></svg>
        </span>
        Comic (เร็ว ๆ นี้ !)
      </span>
    </div>
  </div>
</div>

</body>
</html>
