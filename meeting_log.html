<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกการประชุม</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #004289;
    --primary-dark: #002f63;
    --primary-light: #e6eef8;
    --primary-mid: #b3cceb;
    --accent: #0072ce;
    --accent-hover: #005fa8;
    --bg: #f0f4fa;
    --surface: #ffffff;
    --surface-2: #f5f8fd;
    --border: #c2d4ea;
    --border-light: #dce8f5;
    --text: #0a1f3c;
    --text-mid: #3a5a80;
    --text-light: #7a9bbf;
    --danger: #c0392b;
    --danger-bg: #fdf0f0;
    --shadow: rgba(0, 66, 137, 0.10);
    --shadow-md: rgba(0, 66, 137, 0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans Thai Looped', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  /* ─── HEADER ─── */
  .app-header {
    background: var(--primary);
    color: white;
    padding: 0 40px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 12px var(--shadow-md);
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .app-header .logo { font-size: 18px; font-weight: 700; }
  .app-header .subtitle { font-size: 12px; opacity: 0.55; margin-top: 1px; font-weight: 400; }
  .header-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.18); margin: 0 8px; }
  .header-hint { font-size: 12.5px; opacity: 0.5; font-weight: 400; }

  /* ─── LAYOUT ─── */
  .workspace { max-width: 960px; margin: 36px auto; padding: 0 24px 80px; }

  /* ─── SECTION LABEL ─── */
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--primary); opacity: 0.75;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border-light); }

  /* ─── CARD ─── */
  .card {
    background: var(--surface); border-radius: 10px;
    box-shadow: 0 1px 4px var(--shadow), 0 0 0 1px var(--border-light);
    margin-bottom: 20px; overflow: hidden;
  }
  .card-header {
    background: var(--primary); color: white;
    padding: 13px 20px; font-size: 13.5px; font-weight: 600;
    display: flex; align-items: center; gap: 9px;
  }
  .card-header svg { opacity: 0.75; flex-shrink: 0; }
  .card-body { padding: 22px; }

  /* ─── AGENDA SUMMARY ─── */
  .agenda-summary-card {
    background: var(--primary-light);
    border: 1px solid var(--primary-mid);
    border-radius: 10px; padding: 16px 20px; margin-bottom: 20px;
  }
  .agenda-summary-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--primary);
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .agenda-summary-title svg { opacity: 0.7; }
  .agenda-summary-list { display: flex; flex-direction: column; gap: 6px; }
  .summary-row {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 14px; color: var(--text); animation: fadeIn 0.22s ease;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .summary-badge {
    background: var(--primary); color: white;
    font-size: 11px; font-weight: 700;
    min-width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .summary-topic-placeholder { color: var(--text-light); font-style: italic; }
  .summary-empty { font-size: 13px; color: var(--text-light); font-style: italic; }

  /* ─── FORM ─── */
  .form-row { display: grid; gap: 14px; margin-bottom: 14px; }
  .form-row.cols-3 { grid-template-columns: 2fr 1fr 1fr; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--text-mid);
  }
  .field input, .field textarea {
    font-family: 'IBM Plex Sans Thai Looped', sans-serif;
    font-size: 14.5px; color: var(--text);
    background: var(--surface-2); border: 1.5px solid var(--border);
    border-radius: 7px; padding: 9px 12px; outline: none;
    transition: border-color 0.18s, box-shadow 0.18s, background 0.18s; width: 100%;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--accent); background: white;
    box-shadow: 0 0 0 3px rgba(0,114,206,0.13);
  }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.65; }

  /* ─── AGENDA ITEMS ─── */
  .agenda-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
  .agenda-item {
    border: 1.5px solid var(--border); border-left: 4px solid var(--accent);
    background: var(--surface-2); border-radius: 8px; padding: 15px 18px;
    animation: slideIn 0.28s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .agenda-item-header { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
  .agenda-num {
    background: var(--accent); color: white; width: 26px; height: 26px;
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .agenda-item-title { font-size: 13px; font-weight: 700; color: var(--primary); letter-spacing: 0.04em; text-transform: uppercase; }
  .remove-btn {
    margin-left: auto; background: none; border: 1.5px solid var(--border);
    border-radius: 6px; width: 28px; height: 28px; cursor: pointer;
    color: var(--text-light); font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s; line-height: 1;
  }
  .remove-btn:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }

  /* ─── BUTTONS ─── */
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    font-family: 'IBM Plex Sans Thai Looped', sans-serif;
    font-size: 14px; font-weight: 600; padding: 10px 20px;
    border-radius: 8px; cursor: pointer; border: none;
    display: flex; align-items: center; gap: 8px; transition: all 0.18s;
  }
  .btn-add { background: var(--primary-light); color: var(--primary); border: 1.5px dashed var(--primary-mid); }
  .btn-add:hover { background: #d0e3f5; border-color: var(--accent); color: var(--accent); }
  .btn-print { background: var(--primary); color: white; margin-left: auto; box-shadow: 0 2px 8px var(--shadow-md); }
  .btn-print:hover { background: var(--accent); transform: translateY(-1px); box-shadow: 0 5px 16px rgba(0,114,206,0.28); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
  .btn-secondary:hover { background: var(--surface-2); }

  /* ─── MODAL ─── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,30,70,0.55); z-index: 1000;
    align-items: center; justify-content: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white; width: 720px; max-width: 95vw; max-height: 90vh;
    border-radius: 12px; box-shadow: 0 24px 64px rgba(0,30,80,0.35);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    padding: 15px 22px; background: var(--primary); color: white;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600;
  }
  .modal-close { background: none; border: none; color: white; opacity: 0.55; cursor: pointer; font-size: 22px; line-height: 1; transition: opacity 0.18s; font-family: inherit; }
  .modal-close:hover { opacity: 1; }
  .modal-body { overflow-y: auto; padding: 40px 56px; flex: 1; }
  .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border-light); display: flex; gap: 10px; justify-content: flex-end; background: var(--surface-2); }

  /* ─── THAI DOC PREVIEW (Sarabun) ─── */
  .th-doc { font-family: 'Sarabun', sans-serif; font-size: 15px; line-height: 2; color: #000; }
  .th-doc .doc-title { text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 20px; }
  .th-doc .doc-open { margin-bottom: 16px; }
  .th-doc .agenda-toc { margin-bottom: 20px; }
  .th-doc .toc-item { padding-left: 32px; }
  .th-doc .doc-agenda-block { margin-bottom: 18px; }
  .th-doc .ag-label { font-weight: 700; margin-bottom: 2px; }
  .th-doc .doc-content-indent { padding-left: 48px; margin-bottom: 2px; }
  .th-doc .doc-resolution-label { font-weight: 700; margin-top: 4px; margin-bottom: 2px; }
  .th-doc .doc-resolution-indent { padding-left: 48px; margin-bottom: 6px; }
  .th-doc .doc-close { margin-top: 16px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-brand">
    <div class="header-icon">
      <svg width="20" height="20" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    </div>
    <div>
      <div class="logo">บันทึกการประชุม</div>
      <div class="subtitle">Meeting Minutes System</div>
    </div>
  </div>
  <div class="header-divider"></div>
  <div class="header-hint">กรอกข้อมูล แล้วกด "ดูตัวอย่าง / พิมพ์"</div>
</header>

<div class="workspace">

  <div class="section-label">
    <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    ข้อมูลทั่วไป
  </div>

  <div class="card">
    <div class="card-header">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      ข้อมูลการประชุม
    </div>
    <div class="card-body">
      <div class="form-row" style="grid-template-columns:1fr; margin-bottom:14px;">
        <div class="field">
          <label>หัวข้อการประชุม</label>
          <input type="text" id="meetingTopic" placeholder="เช่น การประชุมคณะกรรมการบริหาร ครั้งที่ 1/2568">
        </div>
      </div>
      <div class="form-row cols-3">
        <div class="field">
          <label>วันที่</label>
          <input type="date" id="meetingDate">
        </div>
        <div class="field">
          <label>เวลาเปิดประชุม</label>
          <input type="time" id="startTime">
        </div>
        <div class="field">
          <label>เวลาปิดประชุม</label>
          <input type="time" id="endTime">
        </div>
      </div>
    </div>
  </div>

  <div class="section-label">
    <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 10h16M4 14h16M4 18h7"/></svg>
    ระเบียบวาระ
  </div>

  <!-- Live agenda summary -->
  <div class="agenda-summary-card">
    <div class="agenda-summary-title">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      สรุปวาระทั้งหมด
    </div>
    <div class="agenda-summary-list" id="agendaSummary">
      <div class="summary-empty">ยังไม่มีวาระ — กด "เพิ่มวาระ" ด้านล่าง</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h7"/></svg>
      รายละเอียดวาระการประชุม
    </div>
    <div class="card-body">
      <div class="agenda-list" id="agendaList"></div>
      <div class="btn-row">
        <button class="btn btn-add" onclick="addAgenda()">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          เพิ่มวาระ
        </button>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-print" onclick="showPreview()">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 012-2h6a2 2 0 012 2v6"/></svg>
      ดูตัวอย่าง / พิมพ์เอกสาร
    </button>
  </div>

</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <div class="modal-header">
      <span>ตัวอย่างเอกสาร — บันทึกการประชุม</span>
      <button class="modal-close" onclick="closePreview()">×</button>
    </div>
    <div class="modal-body">
      <div class="th-doc" id="docPreview"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closePreview()">ปิด</button>
      <button class="btn btn-print" onclick="printDoc()">
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 012-2h6a2 2 0 012 2v6"/></svg>
        พิมพ์ PDF
      </button>
    </div>
  </div>
</div>

<script>
let agendaCount = 0;

function updateSummary() {
  const items = document.querySelectorAll('.agenda-item');
  const box = document.getElementById('agendaSummary');
  if (items.length === 0) {
    box.innerHTML = '<div class="summary-empty">ยังไม่มีวาระ — กด "เพิ่มวาระ" ด้านล่าง</div>';
    return;
  }
  let html = '';
  let idx = 0;
  items.forEach(item => {
    const id = item.id.replace('agenda-', '');
    idx++;
    const topicEl = document.getElementById(`ag-topic-${id}`);
    const topic = topicEl ? topicEl.value.trim() : '';
    html += `<div class="summary-row">
      <div class="summary-badge">${idx}</div>
      <span>${topic || '<span class="summary-topic-placeholder">ยังไม่ได้กรอกหัวข้อ</span>'}</span>
    </div>`;
  });
  box.innerHTML = html;
}

function addAgenda() {
  agendaCount++;
  const num = agendaCount;
  const list = document.getElementById('agendaList');
  const div = document.createElement('div');
  div.className = 'agenda-item';
  div.id = `agenda-${num}`;
  div.innerHTML = `
    <div class="agenda-item-header">
      <div class="agenda-num">${num}</div>
      <div class="agenda-item-title">วาระที่ ${num}</div>
      <button class="remove-btn" onclick="removeAgenda(${num})" title="ลบวาระ">×</button>
    </div>
    <div class="form-row" style="grid-template-columns:1fr; margin-bottom:12px;">
      <div class="field">
        <label>หัวข้อวาระ</label>
        <input type="text" id="ag-topic-${num}" oninput="updateSummary()" placeholder="เช่น รับรองรายงานการประชุม">
      </div>
    </div>
    <div class="form-row" style="grid-template-columns:1fr; margin-bottom:12px;">
      <div class="field">
        <label>เนื้อหา / รายละเอียด</label>
        <textarea id="ag-content-${num}" placeholder="รายละเอียดการประชุม..."></textarea>
      </div>
    </div>
    <div class="form-row" style="grid-template-columns:1fr; margin-bottom:0;">
      <div class="field">
        <label>มติที่ประชุม</label>
        <textarea id="ag-resolution-${num}" placeholder="มติที่ประชุมมีมติ..."></textarea>
      </div>
    </div>
  `;
  list.appendChild(div);
  updateSummary();
}

function removeAgenda(num) {
  const el = document.getElementById(`agenda-${num}`);
  if (el) { el.remove(); updateSummary(); }
}

function formatThaiDate(dateStr) {
  if (!dateStr) return '..................';
  const [y, m, d] = dateStr.split('-');
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${parseInt(y)+543}`;
}

function formatTime(t) {
  if (!t) return '.......';
  return t.replace(':', '.');
}

function collectAgendas() {
  const items = document.querySelectorAll('.agenda-item');
  const agendas = [];
  items.forEach(item => {
    const id = item.id.replace('agenda-', '');
    agendas.push({
      topic: document.getElementById(`ag-topic-${id}`)?.value || '',
      content: document.getElementById(`ag-content-${id}`)?.value || '',
      resolution: document.getElementById(`ag-resolution-${id}`)?.value || ''
    });
  });
  return agendas;
}

function showPreview() {
  const topic = document.getElementById('meetingTopic').value.trim() || '................................';
  const date  = document.getElementById('meetingDate').value;
  const start = document.getElementById('startTime').value;
  const end   = document.getElementById('endTime').value;
  const agendas = collectAgendas();

  // TOC — agenda list before first detail block
  let tocHTML = '';
  if (agendas.length > 0) {
    const rows = agendas.map((ag, i) =>
      `<div class="toc-item">วาระที่ ${i+1}${ag.topic ? '  ' + ag.topic : ''}</div>`
    ).join('');
    tocHTML = `<div class="agenda-toc">${rows}</div>`;
  }

  // Agenda detail blocks
  const agendaHTML = agendas.length === 0
    ? `<div class="doc-agenda-block">
        <div class="ag-label">วาระที่ 1 .....................................</div>
        <div class="doc-content-indent">-</div>
        <div class="doc-resolution-label">มติที่ประชุม</div>
        <div class="doc-resolution-indent">-</div>
      </div>`
    : agendas.map((ag, i) => `
      <div class="doc-agenda-block">
        <div class="ag-label">วาระที่ ${i+1} ${ag.topic || '.....................................'}</div>
        <div class="doc-content-indent">${ag.content ? ag.content.replace(/\n/g,'<br>') : '-'}</div>
        <div class="doc-resolution-label">มติที่ประชุม</div>
        <div class="doc-resolution-indent">${ag.resolution ? ag.resolution.replace(/\n/g,'<br>') : '-'}</div>
      </div>`).join('');

  document.getElementById('docPreview').innerHTML = `
    <div class="doc-title">
      บันทึกการประชุม${topic !== '................................' ? topic : '.......'}<br>
      วันที่ ${formatThaiDate(date)}&nbsp;&nbsp;เวลา ${formatTime(start)} น.
    </div>
    <div class="doc-open">เปิดการประชุมเวลา ${formatTime(start)} น.</div>
    ${tocHTML}
    ${agendaHTML}
    <div class="doc-close">ปิดการประชุมเวลา ${formatTime(end)} น.</div>
  `;
  document.getElementById('previewModal').classList.add('show');
}

function closePreview() {
  document.getElementById('previewModal').classList.remove('show');
}

function printDoc() {
  const content = document.getElementById('docPreview').innerHTML;
  const win = window.open('', '_blank', 'width=794,height=1123');
  win.document.write(`<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>บันทึกการประชุม</title>
